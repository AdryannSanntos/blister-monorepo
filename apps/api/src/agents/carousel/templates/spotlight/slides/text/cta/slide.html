<div data-carousel-layer="bg" class="slide slide-cta">
  <div class="slide__bg"></div>
  <header class="slide-header">
    <span class="slide-header__brand">Powered by {{brand}}</span>
    <span class="slide-header__center">{{meta_center}}</span>
    <span class="slide-header__meta">{{meta_year}}</span>
  </header>
  <main class="slide-main slide-cta__main">
    <div class="card card--cta">
      <div class="card__pad">
        <span class="badge-pill"><span class="badge-pill__dot"></span>{{subtitle}}</span>
        <h2 class="card-title card-title--cta">{{title}}</h2>
        <p class="card-body">{{body}}</p>
        <span class="cta-chip">{{call_to_action}}</span>
      </div>
    </div>
    <div class="handle-pill">
      <span class="handle-pill__logo"></span>
      <span>{{meta_center}}</span>
    </div>
  </main>
  <footer class="slide-footer">
    <span hidden>{{meta_right}}</span>
    <div class="progress-track"><span class="progress-fill" style="width: {{progress}}%"></span></div>
    <span class="slide-counter">{{slide_current}}/{{slide_total}}</span>
  </footer>
</div>
