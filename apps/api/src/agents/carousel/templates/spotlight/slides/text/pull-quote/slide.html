<div data-carousel-layer="bg" class="slide slide-quote">
  <div class="slide__bg"></div>
  <header class="slide-header">
    <span class="slide-header__brand">Powered by {{brand}}</span>
    <span class="slide-header__center">{{meta_center}}</span>
    <span class="slide-header__meta">{{meta_year}}</span>
  </header>
  <main class="slide-main slide-quote__main">
    <div class="quote">
      <span class="quote__mark">"</span>
      <p>{{body}}</p>
      <span class="quote__cite">— {{subtitle}}</span>
    </div>
  </main>
  <footer class="slide-footer">
    <span hidden>{{meta_right}}</span>
    <div class="progress-track"><span class="progress-fill" style="width: {{progress}}%"></span></div>
    <span class="slide-counter">{{slide_current}}/{{slide_total}}</span>
  </footer>
</div>
