<div data-carousel-layer="bg" class="slide slide-volt slide-volt--single">
  <header class="volt-top">
    <span class="handle-pill"><span class="handle-pill__logo"></span>{{meta_center}}</span>
    <span class="volt-tag">{{brand}}</span>
  </header>
  <main class="slide-main slide-volt__main">
    <h2 class="volt-title">{{title}}</h2>
    <p class="volt-body">{{body}}</p>
    <div class="volt-card slide-volt__single"><img src="{{image_url}}" alt="" /></div>
  </main>
  <footer class="slide-footer">
    <span hidden>{{meta_right}}</span>
    <div class="progress-track"><span class="progress-fill" style="width: {{progress}}%"></span></div>
    <span class="slide-counter">{{slide_current}}/{{slide_total}}</span>
  </footer>
</div>
