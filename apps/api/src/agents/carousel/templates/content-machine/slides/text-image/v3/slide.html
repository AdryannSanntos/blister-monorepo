<div class="slide theme-light slide-sandwich">
  <header class="slide-header slide-header--triple">
    <span class="slide-header__brand">Powered by {{brand}}</span>
    <span class="slide-header__center">{{meta_center}}</span>
    <span class="slide-header__meta">{{meta_year}}</span>
  </header>
  <main class="slide-main slide-sandwich__main">
    <div class="copy-stack slide-sandwich__stack">
      <p class="copy-block copy-block--serif">{{body}}</p>
      <p class="copy-block copy-block--sans">{{body2}}</p>
    </div>
    <div class="proof-image slide-sandwich__image">
      <img src="{{image_url}}" alt="" />
    </div>
    <p class="copy-block copy-block--sans slide-sandwich__closing">{{subtitle}}</p>
  </main>
  <footer class="slide-footer slide-footer--hidden">
    <span hidden>{{meta_right}}</span>
    <div class="progress-track">
      <span class="progress-fill" style="width: {{progress}}%"></span>
    </div>
    <span class="slide-counter">{{slide_current}}/{{slide_total}}</span>
  </footer>
</div>
