<div data-carousel-layer="bg" class="slide slide-reel slide-reel--cover slide--cover">
  <div class="reel-bg">
    <img src="{{image_url}}" alt="" />
    <div class="reel-bg__scrim reel-bg__scrim--bottom"></div>
    <div class="reel-bg__vignette"></div>
  </div>
  <div class="reel-top">
    <span class="handle-pill"><span class="handle-pill__logo"></span>{{meta_center}}</span>
    <span class="reel-no">FRAME {{slide_current}}</span>
  </div>
  <main class="slide-main slide-reel__main slide-reel__main--bottom">
    <h1 class="reel-title reel-title--cover">{{title}}</h1>
  </main>
  <span class="swipe-hint">Arrasta →</span>
  <footer class="slide-footer slide-footer--hidden">
    <span hidden>{{meta_right}}</span>
    <div class="progress-track"><span class="progress-fill" style="width: {{progress}}%"></span></div>
    <span class="slide-counter">{{slide_current}}/{{slide_total}}</span>
  </footer>
</div>
