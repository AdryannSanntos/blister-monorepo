<div data-carousel-layer="bg" class="slide slide-reel slide-reel--close">
  <div class="reel-top">
    <span class="handle-pill"><span class="handle-pill__logo"></span>{{meta_center}}</span>
    <span class="reel-no">FRAME {{slide_current}}</span>
  </div>
  <main class="slide-main slide-reel__main slide-reel__main--mid">
    <h2 class="reel-title reel-title--close">{{body}}</h2>
    <p class="reel-body">{{body2}}</p>
    <p class="reel-body">{{subtitle}}</p>
    <span class="reel-chip">Link na bio →</span>
  </main>
  <footer class="slide-footer">
    <span hidden>{{meta_right}}</span>
    <div class="progress-track"><span class="progress-fill" style="width: {{progress}}%"></span></div>
    <span class="slide-counter">{{slide_current}}/{{slide_total}}</span>
  </footer>
</div>
