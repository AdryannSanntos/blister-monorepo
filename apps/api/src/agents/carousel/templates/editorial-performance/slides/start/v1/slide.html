<div class="slide theme-dark slide-start">
  <div class="slide-start__bg">
    <img src="{{image_url}}" alt="" />
    <div class="slide-start__overlay"></div>
  </div>
  <header class="slide-header">
    <span class="slide-header__brand">{{brand}}</span>
    <span class="slide-header__meta">{{meta_right}}</span>
  </header>
  <main class="slide-main slide-start__main">
    <span class="badge-pill">{{badge}}</span>
    <h1 class="display-title slide-start__title">{{title}}</h1>
    <p class="slide-start__subtitle">{{subtitle}}</p>
  </main>
  <footer class="slide-footer">
    <div class="progress-track">
      <span class="progress-fill" style="width: {{progress}}%"></span>
    </div>
    <span class="slide-counter">{{slide_current}}/{{slide_total}}</span>
  </footer>
</div>
