<div class="slide theme-dark slide-proof-headline-first">
  <header class="slide-header">
    <span class="slide-header__brand">{{brand}}</span>
    <span class="slide-header__meta">{{meta_right}}</span>
  </header>
  <main class="slide-main">
    <h1 class="display-title slide-proof-headline-first__title">{{title}}</h1>
    <p class="body-text body-text--light slide-proof-headline-first__intro">{{body}}</p>
    <div class="card-white proof-card slide-proof-headline-first__proof">
      <img src="{{image_url}}" alt="" />
    </div>
    <p class="body-text body-text--light slide-proof-headline-first__closing">{{call_to_action}}</p>
  </main>
  <footer class="slide-footer">
    <div class="progress-track">
      <span class="progress-fill" style="width: {{progress}}%"></span>
    </div>
    <span class="slide-counter">{{slide_current}}/{{slide_total}}</span>
  </footer>
</div>
