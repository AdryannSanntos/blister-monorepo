<div class="slide theme-light slide-illustration">
  <header class="slide-header">
    <span class="slide-header__brand">{{brand}}</span>
    <span class="slide-header__meta">{{meta_right}}</span>
  </header>
  <main class="slide-main">
    <h1 class="display-title slide-illustration__title">{{title}}</h1>
    <p class="body-text slide-illustration__intro">{{body}}</p>
    <div class="card-white illustration-card slide-illustration__card">
      <img src="{{image_url}}" alt="" />
    </div>
    <p class="body-text slide-illustration__closing">{{call_to_action}}</p>
  </main>
  <footer class="slide-footer">
    <div class="progress-track progress-track--dark">
      <span class="progress-fill" style="width: {{progress}}%"></span>
    </div>
    <span class="slide-counter">{{slide_current}}/{{slide_total}}</span>
  </footer>
</div>
