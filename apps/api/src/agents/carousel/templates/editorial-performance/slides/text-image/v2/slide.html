<div class="slide theme-light slide-concept-card">
  <header class="slide-header">
    <span class="slide-header__brand">{{brand}}</span>
    <span class="slide-header__meta">{{meta_right}}</span>
  </header>
  <main class="slide-main">
    <h1 class="display-title slide-concept-card__title">{{title}}</h1>
    <ul class="arrow-list slide-concept-card__list">{{list_html}}</ul>
    <div class="card-white hero-card slide-concept-card__card">
      <img src="{{image_url}}" alt="" />
    </div>
    <p class="body-text slide-concept-card__closing">{{call_to_action}}</p>
  </main>
  <footer class="slide-footer">
    <div class="progress-track progress-track--dark">
      <span class="progress-fill" style="width: {{progress}}%"></span>
    </div>
    <span class="slide-counter">{{slide_current}}/{{slide_total}}</span>
  </footer>
</div>
