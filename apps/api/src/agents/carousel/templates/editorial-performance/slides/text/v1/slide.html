<div class="slide theme-section slide-framework">
  <header class="slide-header">
    <span class="slide-header__brand">{{brand}}</span>
    <span class="slide-header__meta">{{meta_right}}</span>
  </header>
  <main class="slide-main slide-framework__main">
    <h1 class="display-title slide-framework__title">{{title}}</h1>
    <ul class="arrow-list slide-framework__list">{{list_html}}</ul>
    <p class="slide-framework__closing-pill">{{call_to_action}}</p>
  </main>
  <footer class="slide-footer">
    <div class="progress-track">
      <span class="progress-fill" style="width: {{progress}}%"></span>
    </div>
    <span class="slide-counter">{{slide_current}}/{{slide_total}}</span>
  </footer>
</div>
