<div class="slide theme-light slide-image-card">
  <header class="slide-header">
    <span class="slide-header__brand">{{brand}}</span>
    <span class="slide-header__meta">{{meta_right}}</span>
  </header>
  <main class="slide-main slide-image-card__main">
    <div class="card-white slide-image-card__frame">
      <img src="{{image_url}}" alt="" />
    </div>
    <h1 class="display-title slide-image-card__title">{{title}}</h1>
    <p class="body-text slide-image-card__body">{{body}}</p>
  </main>
  <footer class="slide-footer">
    <div class="progress-track progress-track--dark">
      <span class="progress-fill" style="width: {{progress}}%"></span>
    </div>
    <span class="slide-counter">{{slide_current}}/{{slide_total}}</span>
  </footer>
</div>
