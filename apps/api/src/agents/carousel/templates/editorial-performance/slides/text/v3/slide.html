<div class="slide theme-light slide-cta">
  <header class="slide-header">
    <span class="slide-header__brand">{{brand}}</span>
    <span class="slide-header__meta">{{meta_right}}</span>
  </header>
  <main class="slide-main slide-cta__main">
    <p class="body-text slide-cta__lead">{{body}}</p>
    <p class="body-text slide-cta__support">{{subtitle}}</p>
    <div class="slide-cta__box">
      <span class="slide-cta__hint">{{call_to_action}}</span>
      <span class="display-title slide-cta__keyword">{{title}}</span>
    </div>
  </main>
  <footer class="slide-footer">
    <div class="progress-track progress-track--dark">
      <span class="progress-fill" style="width: {{progress}}%"></span>
    </div>
    <span class="slide-counter">{{slide_current}}/{{slide_total}}</span>
  </footer>
</div>
