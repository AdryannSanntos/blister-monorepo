<div class="slide theme-light slide-thumb-checklist">
  <header class="slide-header">
    <span class="slide-header__brand">{{brand}}</span>
    <span class="slide-header__meta">{{meta_right}}</span>
  </header>
  <main class="slide-main slide-thumb-checklist__main">
    <div class="thumb-strip slide-thumb-checklist__strip">
      <div class="thumb-strip__item"><img src="{{image_url}}" alt="" /></div>
      <div class="thumb-strip__item"><img src="{{image_url_2}}" alt="" /></div>
      <div class="thumb-strip__item"><img src="{{image_url_3}}" alt="" /></div>
    </div>
    <h1 class="display-title slide-thumb-checklist__title">{{title}}</h1>
    <ul class="check-list slide-thumb-checklist__list">{{list_html}}</ul>
  </main>
  <footer class="slide-footer">
    <div class="progress-track progress-track--dark">
      <span class="progress-fill" style="width: {{progress}}%"></span>
    </div>
    <span class="slide-counter">{{slide_current}}/{{slide_total}}</span>
  </footer>
</div>
