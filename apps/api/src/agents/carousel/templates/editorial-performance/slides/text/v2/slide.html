<div class="slide theme-section slide-synthesis">
  <header class="slide-header">
    <span class="slide-header__brand">{{brand}}</span>
    <span class="slide-header__meta">{{meta_right}}</span>
  </header>
  <main class="slide-main">
    <h1 class="display-title slide-synthesis__title">{{title}}</h1>
    <p class="body-text slide-synthesis__subtitle">{{subtitle}}</p>
    <ul class="check-list slide-synthesis__list">{{list_html}}</ul>
    <p class="slide-synthesis__closing">{{call_to_action}}</p>
  </main>
  <footer class="slide-footer">
    <div class="progress-track progress-track--dark">
      <span class="progress-fill" style="width: {{progress}}%"></span>
    </div>
    <span class="slide-counter">{{slide_current}}/{{slide_total}}</span>
  </footer>
</div>
