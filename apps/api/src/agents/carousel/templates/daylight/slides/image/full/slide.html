<div data-carousel-layer="bg" class="slide slide-daylight slide-daylight--full">
  <header class="day-top">
    <span class="day-top__brand">{{brand}}</span>
    <span class="day-top__index">{{slide_current}}</span>
    <span class="day-top__handle">{{meta_right}}</span>
  </header>
  <div class="day-rule"></div>
  <main class="slide-main slide-daylight__main slide-daylight__main--full">
    <div class="media-card slide-daylight__full-card"><img src="{{image_url}}" alt="" /></div>
    <p class="slide-daylight__caption">{{subtitle}}</p>
  </main>
  <footer class="slide-footer">
    <span hidden>{{meta_right}}</span>
    <div class="progress-track"><span class="progress-fill" style="width: {{progress}}%"></span></div>
    <span class="slide-counter">{{slide_current}}/{{slide_total}}</span>
  </footer>
</div>
