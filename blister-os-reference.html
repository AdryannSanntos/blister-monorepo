<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blister OS — Redesign (Standalone)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;family=Instrument+Serif:ital@0;1&amp;display=swap" rel="stylesheet" />
<style>
/* ============================================================
   Blister OS — espelha o design system real do projeto (globals.css)
   Satoshi (corpo) · Poppins (headings + botões) · roxo primary-600
   Tema via classe .dark no <html> (igual ao produto)
   ============================================================ */

:root {
  color-scheme: light;

  /* primary */
  --primary-50: #ecf2ff; --primary-100: #ced4ff; --primary-200: #b0b4ff;
  --primary-300: #9594ff; --primary-400: #7e76ff; --primary-500: #6958ff;
  --primary-600: #563be7; --primary-700: #4820d2; --primary-800: #3b00b8;
  --primary-900: #2e0095; --primary-950: #210074;
  /* secondary (rosa) */
  --secondary-300: #ff85b9; --secondary-600: #f83b87; --secondary-700: #d5006b;
  /* accent (laranja) */
  --orange-300: #ffb26b; --orange-600: #fb8423; --orange-900: #842a00;
  /* success */
  --success-300: #6fe3de; --success-600: #05bcb7; --success-900: #005a57;
  /* warning */
  --warning-300: #ffd660; --warning-600: #ffbd00; --warning-900: #825000;
  /* error */
  --error-300: #ff877c; --error-500: #ff514d; --error-600: #f53b3b;
  --error-700: #d3001c; --error-800: #ae0000; --error-900: #850000;
  /* info */
  --info-600: #3b82f6;
  /* neutral */
  --neutral-100: #f4f5f7; --neutral-200: #d7d9e3; --neutral-300: #b2b5c4;
  --neutral-400: #8d90a1; --neutral-500: #6b6e7a; --neutral-600: #4a4d5a;
  --neutral-700: #2a2c39; --neutral-800: #1a1b23; --neutral-900: #0e0f16;

  --gradient-primary: linear-gradient(135deg, #563be7 0%, #7b5ce8 100%);
  --gradient-spark: linear-gradient(135deg, #f83b87 0%, #fb8423 50%, #05bcb7 100%);

  /* surfaces & text (light) */
  --bg-canvas: #f6f7f9;
  --bg-base: #ffffff;
  --bg-raised: #ffffff;
  --bg-overlay: #ffffff;
  --bg-sunken: var(--neutral-100);
  --bg-hover: var(--neutral-200);
  --bg-active: var(--neutral-300);

  --fg-primary: var(--neutral-900);
  --fg-secondary: var(--neutral-600);
  --fg-tertiary: var(--neutral-500);
  --fg-quaternary: var(--neutral-400);
  --fg-on-accent: #ffffff;

  --accent: var(--primary-600);
  --accent-hover: var(--primary-700);
  --accent-active: var(--primary-800);
  --accent-soft: var(--primary-50);
  --accent-soft-hi: var(--primary-100);
  --accent-soft-text: var(--primary-700);

  --brand-secondary-soft: #ffe3f3;
  --brand-secondary-soft-text: var(--secondary-700);

  --success: var(--success-600);
  --success-soft: #dafffd;
  --success-soft-text: var(--success-900);
  --warning: var(--warning-600);
  --warning-soft: #fff4cd;
  --warning-soft-text: var(--warning-900);
  --danger: var(--error-600);
  --danger-soft: #ffe5de;
  --danger-soft-text: var(--error-900);

  --line-subtle: color-mix(in srgb, var(--neutral-200) 55%, transparent);
  --line-default: var(--neutral-200);
  --line-strong: var(--neutral-300);
  --ring-focus: var(--primary-200);

  --control-h-sm: 32px;
  --control-h-md: 40px;
  --control-h-lg: 48px;

  --r-xs: 4px; --r-sm: 8px; --r-md: 11px; --r-lg: 16px;
  --r-xl: 20px; --r-2xl: 24px; --r-full: 999px;

  --shadow-xs: 0 1px 2px rgba(14, 15, 22, 0.06), 0 1px 1px rgba(14, 15, 22, 0.04);
  --shadow-sm: 0 2px 6px rgba(14, 15, 22, 0.08), 0 1px 2px rgba(14, 15, 22, 0.05);
  --shadow-md: 0 6px 16px rgba(14, 15, 22, 0.1), 0 2px 4px rgba(14, 15, 22, 0.05);

  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --dur-fast: 140ms;
  --dur-base: 200ms;

  --font-sans: "Satoshi", -apple-system, BlinkMacSystemFont, "Segoe UI", ui-sans-serif, system-ui, sans-serif;
  --font-heading: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", ui-sans-serif, system-ui, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "JetBrains Mono", "SF Mono", Menlo, monospace;

  --sidebar-w: 18rem;
  --sidebar-w-collapsed: 4.25rem;

  /* aliases (nomes usados nas páginas → tokens reais) */
  --surface: var(--bg-raised);
  --surface-2: var(--bg-sunken);
  --surface-3: var(--bg-hover);
  --border: var(--line-default);
  --border-strong: var(--line-strong);
  --text: var(--fg-primary);
  --text-muted: var(--fg-tertiary);
  --text-subtle: var(--fg-quaternary);
  --accent-strong: var(--primary-600);
  --accent-soft-border: var(--accent-soft-hi);
  --ok: var(--success-600);
  --ok-soft: var(--success-soft);
  --warn: var(--warning-600);
  --pink: var(--secondary-600);
}

.dark {
  color-scheme: dark;

  --bg-canvas: #0a0b11;
  --bg-base: #14151d;
  --bg-raised: #14151d;
  --bg-overlay: #1d1e29;
  --bg-sunken: #20212c;
  --bg-hover: #2a2c39;
  --bg-active: #34374a;

  --fg-primary: #ecedf2;
  --fg-secondary: #9ca0af;
  --fg-tertiary: #6e7280;
  --fg-quaternary: #565a68;

  --accent-soft: rgba(86, 59, 231, 0.2);
  --accent-soft-hi: rgba(86, 59, 231, 0.3);
  --accent-soft-text: var(--primary-300);

  --brand-secondary-soft: rgba(255, 77, 182, 0.18);
  --brand-secondary-soft-text: var(--secondary-300);

  --success-soft: rgba(5, 188, 183, 0.16);
  --success-soft-text: var(--success-300);
  --warning-soft: rgba(255, 210, 63, 0.16);
  --warning-soft-text: var(--warning-300);
  --danger-soft: rgba(255, 59, 48, 0.16);
  --danger-soft-text: var(--error-300);

  --line-subtle: color-mix(in srgb, #2a2c3a 60%, transparent);
  --line-default: #2a2c3a;
  --line-strong: #3a3d4f;
  --ring-focus: rgba(86, 59, 231, 0.4);

  --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.4);
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.45);
  --shadow-md: 0 8px 20px rgba(0, 0, 0, 0.5);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg-canvas);
  color: var(--fg-primary);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  letter-spacing: 0;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
::selection { background: var(--accent-soft-hi); color: var(--fg-primary); }
h1, h2, h3, h4, h5, h6 { font-family: var(--font-heading); margin: 0; }
button { font-family: var(--font-sans); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 99px; border: 2px solid var(--bg-base); }
::-webkit-scrollbar-track { background: transparent; }

@keyframes page-enter {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ============ layout ============ */
.os { display: flex; height: 100vh; overflow: hidden; background: var(--bg-base); }
.os-main { display: flex; flex-direction: column; min-width: 0; flex: 1; background: var(--bg-base); overflow-y: auto; padding-top: 12px; }
.page { padding: 12px 24px 24px; animation: page-enter var(--dur-base) var(--ease-out); }
.page-inner { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; padding: 12px 0; }
.page-inner.narrow { max-width: 1020px; }

/* ============ sidebar (AppSidebar real) ============ */
.sidebar {
  display: flex; flex-direction: column; flex: none;
  width: var(--sidebar-w); height: 100%;
  background: var(--bg-canvas);
  border-right: 1px solid var(--line-subtle);
  border-radius: 0 12px 12px 0;
  overflow: hidden clip;
  transition: width var(--dur-base) var(--ease-out);
}
.sidebar.collapsed { width: var(--sidebar-w-collapsed); }
.sb-head { height: 80px; flex: none; padding: 12px; display: flex; align-items: center; }
.sb-brand { display: flex; align-items: center; gap: 10px; padding-left: 4px; min-width: 0; }
.sb-brand img { width: 34px; height: 34px; object-fit: contain; flex: none; }
.sb-brand .nm { font-family: var(--font-heading); font-weight: 700; font-size: 19px; letter-spacing: -0.01em; white-space: nowrap; }
.sidebar.collapsed .sb-head { justify-content: center; padding: 12px 0; }
.sidebar.collapsed .sb-brand { padding-left: 0; }

.sb-content { flex: 1; overflow-y: auto; overflow-x: clip; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
.nav-label {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 10px; cursor: pointer; border: 0; background: transparent; width: 100%;
  font-family: var(--font-sans); font-size: 10.5px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.14em; color: var(--fg-quaternary);
  transition: color var(--dur-fast);
}
.nav-label:hover { color: var(--fg-secondary); }
.nav-label svg { width: 12px; height: 12px; transition: transform var(--dur-base); }
.nav-label.open svg { transform: rotate(90deg); }
.nav-menu { display: flex; flex-direction: column; gap: 2px; }
.nav-menu.indent { padding-left: 12px; }
.sidebar.collapsed .nav-menu.indent { padding-left: 0; }
.sidebar.collapsed .nav-label { display: none; }

.nav-item {
  display: flex; align-items: center; gap: 10px; width: 100%;
  height: 36px; padding: 0 10px; border: 0; border-radius: var(--r-md);
  background: transparent; text-align: left; cursor: pointer;
  font-family: var(--font-sans); font-size: 13px; font-weight: 500; color: var(--fg-secondary);
  transition: background var(--dur-fast), color var(--dur-fast);
}
.nav-item svg { width: 16px; height: 16px; flex: none; }
.nav-item:hover { background: var(--bg-hover); color: var(--accent); }
.nav-item.active { background: color-mix(in oklch, var(--primary-600) 12%, transparent); color: var(--accent); }
.dark .nav-item.active { color: var(--primary-300); }
.dark .nav-item:hover { color: var(--primary-300); }
.nav-item > span.lbl { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-item .nbadge {
  border-radius: var(--r-sm); padding: 2px 6px; flex: none;
  font-size: 10.5px; font-weight: 500; font-variant-numeric: tabular-nums;
  background: var(--bg-sunken); color: var(--fg-tertiary);
}
.nav-item .nbadge.accent { background: var(--accent-soft); color: var(--accent); }
.dark .nav-item .nbadge.accent { color: var(--primary-300); }
.sidebar.collapsed .nav-item { justify-content: center; padding: 0; }
.sidebar.collapsed .nav-item .lbl, .sidebar.collapsed .nav-item .nbadge { display: none; }

.sb-foot { border-top: 1px solid var(--line-subtle); padding: 8px; flex: none; }
.user-card {
  display: flex; align-items: center; gap: 10px; width: 100%;
  border: 1px solid var(--line-default); background: var(--bg-raised);
  border-radius: var(--r-md); padding: 8px; cursor: pointer; text-align: left;
  transition: background var(--dur-fast);
}
.user-card:hover { background: var(--bg-hover); }
.avatar {
  width: 36px; height: 36px; border-radius: var(--r-full); flex: none;
  background: var(--accent-soft); color: var(--accent-soft-text);
  display: grid; place-items: center; font-size: 11px; font-weight: 700;
}
.user-card .who { min-width: 0; flex: 1; }
.user-card .who .n { font-size: 13px; font-weight: 500; color: var(--fg-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-card .who .e { font-size: 11.5px; color: var(--fg-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-card .chev { color: var(--fg-quaternary); width: 14px; height: 14px; flex: none; }
.sidebar.collapsed .user-card { border: 0; background: transparent; padding: 0; justify-content: center; }
.sidebar.collapsed .user-card .who, .sidebar.collapsed .user-card .chev { display: none; }

/* ============ header flutuante (AppShell real) ============ */
.topbar {
  position: sticky; top: 0; z-index: 20;
  margin: 0 12px; height: 56px; flex: none;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  border: 1px solid var(--line-subtle); border-radius: 12px;
  background: var(--bg-canvas); padding: 0 20px;
}
.crumb { display: flex; align-items: center; gap: 10px; min-width: 0; font-size: 13px; white-space: nowrap; }
.crumb a { color: var(--fg-tertiary); text-decoration: none; cursor: pointer; }
.crumb a:hover { color: var(--fg-primary); }
.crumb .cur { color: var(--fg-primary); font-weight: 500; }
.crumb .sep { color: var(--fg-quaternary); }
.topbar-end { display: flex; align-items: center; gap: 4px; }

.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; border: 0; border-radius: var(--r-md);
  background: transparent; color: var(--fg-secondary); cursor: pointer;
  transition: background var(--dur-fast), color var(--dur-fast);
}
.icon-btn:hover { background: var(--bg-sunken); color: var(--fg-primary); }
.icon-btn svg { width: 16px; height: 16px; }
.icon-btn.danger { color: var(--error-600); }
.icon-btn.danger:hover { color: var(--error-700); }

.credit-pill {
  display: inline-flex; align-items: center; gap: 6px;
  border-radius: var(--r-full); background: var(--bg-sunken);
  padding: 4px 12px; margin-right: 4px;
  font-size: 12px; font-weight: 500; color: var(--fg-secondary);
  cursor: pointer; border: 0; font-variant-numeric: tabular-nums;
  transition: background var(--dur-fast);
}
.credit-pill:hover { background: var(--bg-hover); }
.credit-pill svg { width: 14px; height: 14px; }

/* ============ page header (PageLayout + SurfaceIcon reais) ============ */
.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-head .lead { display: flex; align-items: flex-start; gap: 16px; min-width: 0; }
.surface-icon {
  width: 48px; height: 48px; flex: none; border-radius: var(--r-md);
  background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center;
}
.dark .surface-icon { color: var(--primary-300); }
.surface-icon svg { width: 20px; height: 20px; }
.page-head h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.25; }
.page-head .desc { margin: 4px 0 0; font-size: 13.5px; color: var(--fg-tertiary); }
.page-head .actions { display: flex; align-items: center; gap: 8px; flex: none; flex-wrap: wrap; }

.h-section { font-family: var(--font-heading); font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
.sub { color: var(--fg-tertiary); font-size: 13px; margin: 3px 0 0; }
.mlabel {
  font-size: 11px; font-weight: 500; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--fg-quaternary);
}
.mono { font-variant-numeric: tabular-nums; }

/* ============ botões (button.tsx real: Poppins bold, borda 1.5px color-mix) ============ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: var(--control-h-md); padding: 0 18px; white-space: nowrap;
  border-radius: var(--r-md); border: 1.5px solid color-mix(in srgb, var(--primary-600) 72%, white);
  background: var(--primary-600); color: #fff; cursor: pointer;
  font-family: var(--font-heading); font-weight: 700; font-size: 14px;
  transition: background var(--dur-fast) var(--ease-out), border-color var(--dur-fast), color var(--dur-fast), transform var(--dur-fast);
}
.btn:hover { background: var(--primary-700); border-color: color-mix(in srgb, var(--primary-600) 58%, white); }
.btn:active { transform: translateY(1px); background: var(--primary-800); }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn:disabled { pointer-events: none; transform: none; border-color: var(--line-subtle); background: var(--bg-hover); color: var(--fg-quaternary); }

.btn.grad { background: var(--gradient-primary); }
.btn.grad:hover { background: var(--gradient-primary); filter: brightness(0.94); }

.btn.secondary, .btn.soft {
  border-color: color-mix(in srgb, var(--neutral-400) 28%, var(--bg-sunken));
  background: var(--bg-sunken); color: var(--fg-primary);
}
.btn.secondary:hover, .btn.soft:hover { background: var(--bg-hover); border-color: color-mix(in srgb, var(--neutral-400) 38%, var(--bg-sunken)); }
.btn.secondary:active, .btn.soft:active { background: var(--bg-active); }

.btn.outline { border-color: var(--line-default); background: transparent; color: var(--fg-primary); }
.btn.outline:hover { border-color: var(--line-strong); background: var(--bg-sunken); }
.btn.outline:active { background: var(--bg-hover); }

.btn.ghost { border: 0; background: transparent; color: var(--fg-secondary); }
.btn.ghost:hover { background: var(--bg-sunken); color: var(--fg-primary); }
.btn.ghost:active { background: var(--bg-hover); }

.btn.done { border-color: transparent; background: var(--success-soft); color: var(--success-soft-text); cursor: default; }
.btn.done:hover { background: var(--success-soft); }

.btn.sm { height: var(--control-h-sm); padding: 0 13px; border-radius: 9px; font-size: 13px; gap: 6px; }
.btn.sm svg { width: 14px; height: 14px; }
.btn.lg { height: var(--control-h-lg); padding: 0 24px; border-radius: 13px; font-size: 15px; }

/* ============ cards (card.tsx real) ============ */
.card {
  position: relative; display: flex; flex-direction: column;
  border: 1px solid var(--line-default); border-radius: var(--r-xl);
  background: var(--bg-raised);
  transition: border-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
}
.card:hover { border-color: var(--line-strong); }
.card.pad { padding: 20px; }
.card.hov { cursor: pointer; }
.card.hov:hover { transform: translateY(-1px); }
.card.selected { border-color: var(--accent); }

/* stat card (dashboard-stat-card real) */
.stat-card { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.stat-card .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.stat-card .val { font-family: var(--font-heading); font-size: 24px; font-weight: 500; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; margin-top: 8px; }
.stat-card .val.warn { color: var(--warning); }
.stat-card .ico { border: 1px solid var(--line-default); background: var(--bg-sunken); border-radius: var(--r-md); padding: 8px; color: var(--fg-secondary); }
.stat-card .ico svg { width: 16px; height: 16px; display: block; }
.stat-card .hint { font-size: 12px; color: var(--fg-tertiary); }

/* ============ badges (badge.tsx real: pill 24px, 11.5px bold) ============ */
.badge {
  display: inline-flex; height: 24px; align-items: center; gap: 6px;
  border-radius: var(--r-full); border: 1px solid transparent; padding: 0 10px;
  font-size: 11.5px; font-weight: 700; white-space: nowrap;
  background: var(--bg-sunken); color: var(--fg-secondary);
}
.badge svg { width: 12px; height: 12px; }
.badge.free { background: var(--success-soft); color: var(--success-soft-text); }
.badge.premium { background: var(--warning-soft); color: var(--warning-soft-text); }
.badge.owned { background: var(--accent-soft); color: var(--accent-soft-text); }
.badge.new { background: var(--brand-secondary-soft); color: var(--brand-secondary-soft-text); }
.badge.outline { background: transparent; border-color: var(--line-default); color: var(--fg-secondary); }
.badge .dot { width: 5px; height: 5px; border-radius: 99px; background: currentColor; }

/* ============ campos (input.tsx real) ============ */
.field {
  width: 100%; height: var(--control-h-md); padding: 0 14px;
  border-radius: var(--r-md); border: 1.5px solid var(--line-strong);
  background: var(--bg-base); color: var(--fg-primary);
  font-family: var(--font-sans); font-size: 13.5px; outline: none;
  transition: border-color var(--dur-fast), box-shadow var(--dur-fast);
}
.field::placeholder { color: var(--fg-quaternary); }
.field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search-wrap { position: relative; }
.search-wrap > svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--fg-quaternary); pointer-events: none; }
.search-wrap .field { padding-left: 36px; }

/* segmented (toggle-group) */
.seg { display: inline-flex; gap: 2px; background: var(--bg-sunken); border: 1px solid var(--line-default); border-radius: var(--r-md); padding: 3px; }
.seg button {
  border: 0; background: transparent; color: var(--fg-secondary); cursor: pointer;
  font-family: var(--font-sans); font-size: 12.5px; font-weight: 500;
  padding: 5px 12px; border-radius: var(--r-sm);
  transition: background var(--dur-fast), color var(--dur-fast);
}
.seg button:hover { color: var(--fg-primary); }
.seg button.on { background: var(--bg-raised); color: var(--fg-primary); box-shadow: var(--shadow-xs); }

/* chips de filtro */
.chiprow { display: flex; gap: 8px; flex-wrap: wrap; }
.fchip {
  border: 1px solid var(--line-default); background: var(--bg-raised); color: var(--fg-secondary);
  font-family: var(--font-sans); font-size: 12.5px; font-weight: 500;
  padding: 6px 14px; border-radius: var(--r-full); cursor: pointer; white-space: nowrap;
  transition: background var(--dur-fast), color var(--dur-fast), border-color var(--dur-fast);
}
.fchip:hover { border-color: var(--line-strong); background: var(--bg-sunken); color: var(--fg-primary); }
.fchip.on { background: var(--primary-600); border-color: var(--primary-600); color: #fff; }

/* ============ thumbs (previews abstratos dos itens) ============ */
.thumb { position: relative; overflow: hidden; border-radius: var(--r-md); background: var(--bg-sunken); }
.thumb .grain { position: absolute; inset: 0; opacity: 0.4;
  background-image: repeating-linear-gradient(0deg, transparent 0 2px, rgba(0,0,0,0.1) 2px 3px); }
.thumb .ratio-tag, .thumb .type-tag {
  position: absolute; top: 8px; z-index: 2; white-space: nowrap;
  font-size: 10px; font-weight: 700; letter-spacing: 0.04em;
  background: rgba(10, 11, 17, 0.6); color: #fff; backdrop-filter: blur(4px);
  padding: 2px 8px; border-radius: var(--r-full);
}
.thumb .ratio-tag { right: 8px; }
.thumb .type-tag { left: 8px; }
.thumb .cap {
  position: absolute; left: 50%; bottom: 12%; transform: translateX(-50%); z-index: 2;
  font-family: var(--font-heading); font-weight: 700; font-size: 13px; color: #fff;
  background: rgba(10, 11, 17, 0.72); padding: 3px 10px; border-radius: var(--r-sm); white-space: nowrap;
}

/* ============ stepper ============ */
.steps { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.step { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 500; color: var(--fg-quaternary); white-space: nowrap; }
.step .num {
  width: 24px; height: 24px; border-radius: var(--r-full); display: grid; place-items: center;
  font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums;
  border: 1.5px solid var(--line-default); color: var(--fg-tertiary); background: var(--bg-raised);
}
.step.on { color: var(--fg-primary); }
.step.on .num { background: var(--primary-600); border-color: color-mix(in srgb, var(--primary-600) 72%, white); color: #fff; }
.step.done-step { color: var(--fg-secondary); }
.step.done-step .num { background: var(--accent-soft); border-color: transparent; color: var(--accent-soft-text); }
.step-bar { width: 24px; height: 1.5px; background: var(--line-default); }

/* ============ dropzone (file-upload) ============ */
.dropzone {
  border: 1.5px dashed var(--line-strong); border-radius: var(--r-lg);
  background: var(--bg-sunken);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  padding: 52px 24px; cursor: pointer; text-align: center;
  transition: border-color var(--dur-fast), background var(--dur-fast);
}
.dropzone:hover { border-color: var(--accent); background: var(--accent-soft); }
.dropzone svg { width: 26px; height: 26px; color: var(--fg-quaternary); }

/* progress */
.pbar { height: 8px; border-radius: var(--r-full); background: var(--bg-sunken); overflow: hidden; }
.pbar > div { height: 100%; border-radius: var(--r-full); background: var(--primary-600); transition: width 0.3s var(--ease-out); }

/* ============ listas em card ============ */
.rowlist { display: flex; flex-direction: column; }
.rowlist .row { display: flex; align-items: center; gap: 14px; padding: 12px 20px; border-bottom: 1px solid var(--line-subtle); }
.rowlist .row:last-child { border-bottom: 0; }
.rowlist .row:hover { background: var(--bg-sunken); }
.rowlist .row:first-child { border-radius: var(--r-xl) var(--r-xl) 0 0; }
.rowlist .row:last-child { border-radius: 0 0 var(--r-xl) var(--r-xl); }
.rowlist .row:only-child { border-radius: var(--r-xl); }

.icon-box {
  display: grid; place-items: center; width: 36px; height: 36px; flex: none;
  border-radius: var(--r-md); border: 1px solid var(--line-default);
  background: var(--bg-sunken); color: var(--fg-secondary);
}
.icon-box svg { width: 16px; height: 16px; }
.icon-box.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.dark .icon-box.accent { color: var(--primary-300); }

/* ============ empty state ============ */
.empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  text-align: center; padding: 52px 24px;
  border: 1.5px dashed var(--line-default); border-radius: var(--r-xl);
  background: var(--bg-sunken);
}
.empty .t { font-family: var(--font-heading); font-weight: 600; font-size: 14.5px; }
.empty .d { color: var(--fg-tertiary); font-size: 13px; max-width: 380px; }

/* util */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.flex { display: flex; align-items: center; gap: 10px; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.col { display: flex; flex-direction: column; }

@media (max-width: 1100px) {
  .grid4 { grid-template-columns: repeat(2, 1fr); }
  .grid3 { grid-template-columns: repeat(2, 1fr); }
  .home-studio { grid-template-columns: 1fr !important; }
  .grid2 { grid-template-columns: 1fr; }
}

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}

}

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

// Blister OS — shell fiel ao AppShell/AppSidebar do projeto
const { createContext, useContext, useState, useEffect, useCallback, useMemo } = React;

const OSContext = createContext(null);
const useOS = () => useContext(OSContext);

/* ---------- router por hash: #/pagina/param ---------- */
function parseHash() {
  const h = (location.hash || "#/home").replace(/^#\/?/, "");
  const [page, ...rest] = h.split("/");
  return { page: page || "home", param: rest.join("/") || null };
}

const OWNED_KEY = "blisteros-owned-v1";
const CREDITS_KEY = "blisteros-credits-v1";
const THEME_KEY = "blisteros-theme-v2";
const SIDEBAR_KEY = "blister:sidebar-open-proto";

function OSProvider({ children, tweaks }) {
  const [route, setRoute] = useState(parseHash());
  const [owned, setOwned] = useState(() => {
    try { return { ...INITIAL_OWNED, ...(JSON.parse(localStorage.getItem(OWNED_KEY)) || {}) }; }
    catch (e) { return { ...INITIAL_OWNED }; }
  });
  const [credits, setCredits] = useState(() => {
    const v = parseInt(localStorage.getItem(CREDITS_KEY), 10);
    return Number.isFinite(v) ? v : 240;
  });
  const [theme, setTheme] = useState(() => localStorage.getItem(THEME_KEY) || "light");
  const [sidebarOpen, setSidebarOpen] = useState(() => {
    try { const s = localStorage.getItem(SIDEBAR_KEY); return s !== null ? JSON.parse(s) : true; }
    catch (e) { return true; }
  });

  useEffect(() => {
    const onHash = () => setRoute(parseHash());
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);

  useEffect(() => {
    document.documentElement.classList.toggle("dark", theme === "dark");
    localStorage.setItem(THEME_KEY, theme);
  }, [theme]);

  useEffect(() => { localStorage.setItem(OWNED_KEY, JSON.stringify(owned)); }, [owned]);
  useEffect(() => { localStorage.setItem(CREDITS_KEY, String(credits)); }, [credits]);
  useEffect(() => { try { localStorage.setItem(SIDEBAR_KEY, JSON.stringify(sidebarOpen)); } catch (e) {} }, [sidebarOpen]);

  const nav = useCallback((page, param) => {
    location.hash = "#/" + page + (param ? "/" + param : "");
    const el = document.querySelector(".os-main");
    if (el) el.scrollTop = 0;
  }, []);

  const redeem = useCallback((id) => {
    const item = MKT_ITEMS.find((i) => i.id === id);
    if (!item || owned[id]) return;
    if (item.price === 0) {
      setOwned((o) => ({ ...o, [id]: "resgatado" }));
    } else if (credits >= item.price) {
      setCredits((c) => c - item.price);
      setOwned((o) => ({ ...o, [id]: "comprado" }));
    }
  }, [owned, credits]);

  const value = useMemo(
    () => ({ route, nav, owned, redeem, credits, theme, setTheme, sidebarOpen, setSidebarOpen, tweaks }),
    [route, nav, owned, redeem, credits, theme, sidebarOpen, tweaks]);

  return <OSContext.Provider value={value}>{children}</OSContext.Provider>;
}

/* ---------- thumb abstrata a partir da paleta do item ---------- */
function StyleThumb({ item, ratio = "16 / 10", cap, showType, className = "" }) {
  const [a, b, c] = item.palette;
  const bg = {
    aspectRatio: ratio,
    background:
      `radial-gradient(120% 90% at 85% 0%, ${b}33 0%, transparent 55%),` +
      `radial-gradient(100% 80% at 10% 100%, ${c}22 0%, transparent 50%),` +
      `linear-gradient(150deg, ${a} 0%, ${a} 100%)`,
  };
  return (
    <div className={"thumb " + className} style={bg}>
      <div className="grain"></div>
      <div style={{
        position: "absolute", left: "12%", right: "12%", top: "30%", bottom: "30%",
        borderRadius: "8px", border: `1px solid ${c}2e`,
        background: `linear-gradient(135deg, ${b}29 0%, transparent 70%)`,
      }}></div>
      {showType ? <span className="type-tag">{TYPE_LABEL[item.type]}</span> : null}
      {item.specs ? <span className="ratio-tag">{item.specs.formatos.split("·")[0].trim()}</span> : null}
      {cap ? <span className="cap">{cap}</span> : null}
    </div>
  );
}

/* ---------- estado de posse de um item ---------- */
function OwnBadge({ state }) {
  if (!state) return null;
  return (
    <span className="badge owned"><Ic.check style={{ width: 11, height: 11 }} /> {state === "comprado" ? "Comprado" : "Resgatado"}</span>
  );
}

function PriceBadge({ item, ownedState }) {
  if (ownedState) return <OwnBadge state={ownedState} />;
  return item.price === 0
    ? <span className="badge free">Grátis</span>
    : <span className="badge premium">{item.price} créditos</span>;
}

function RedeemButton({ item, size = "" }) {

  if (item.price === 0) {
    return <button className={"btn outline " + size} onClick={(e) => { e.stopPropagation(); redeem(item.id); }}>Resgatar</button>;
  }
  const can = credits >= item.price;
  return (
    <button className={"btn " + size} disabled={!can} title={can ? "" : "Créditos insuficientes"}
      onClick={(e) => { e.stopPropagation(); redeem(item.id); }}>
      Comprar · {item.price}
    </button>
  );

// Blister OS — Editor de Vídeo (fluxo principal) + Gerador de Cortes
const { useState: useSt, useEffect: useEf, useRef } = React;

const GEN_PHASES = [
  "Transcrevendo falas…",
  "Marcando momentos fortes…",
  "Aplicando o Edit Style…",
  "Renderizando legendas…",
  "Finalizando versões…",
];

function useFakeGeneration(onDone) {
  const [running, setRunning] = useSt(false);
  const [pct, setPct] = useSt(0);
  const timer = useRef(null);
  const start = () => { setRunning(true); setPct(0); };
  useEf(() => {
    if (!running) return undefined;
    timer.current = setInterval(() => {
      setPct((p) => {
        const np = Math.min(100, p + 4 + Math.random() * 6);
        if (np >= 100) { clearInterval(timer.current); setTimeout(() => { setRunning(false); onDone(); }, 350); }
        return np;
      });
    }, 180);
    return () => clearInterval(timer.current);
  }, [running]);
  const phase = GEN_PHASES[Math.min(GEN_PHASES.length - 1, Math.floor(pct / (100 / GEN_PHASES.length)))];
  return { running, pct, phase, start };
}

/* ---------- Arquivos (file browser) ---------- */
function UploadsPage() {
  const { route, nav } = useOS();
  const folderId = route.param || "root";
  const [view, setView] = React.useState("list");
  const folder = FOLDERS.find((f) => f.id === folderId) || FOLDERS[0];
  const childFolders = FOLDERS.filter((f) => f.parentId === folderId);
  const files = FILES.filter((f) => f.folderId === folderId || (folderId === "root" && f.folderId === "root"));
  const crumbs = [];
  let cur = folder;
  while (cur) {
    crumbs.unshift(cur);
    cur = cur.parentId ? FOLDERS.find((f) => f.id === cur.parentId) : null;
  }

  return (
    <div className="page-inner" data-screen-label="Arquivos">
      <div className="between" style={{ marginBottom: 16, flexWrap: "wrap", gap: 12 }}>
        <div>
          <h1 className="h-display">Arquivos</h1>

        </div>
        <div className="flex" style={{ gap: 8 }}>
          <button className={"btn soft sm" + (view === "list" ? " secondary" : "")} onClick={() => setView("list")} aria-pressed={view === "list"}>Lista</button>
          <button className={"btn soft sm" + (view === "grid" ? " secondary" : "")} onClick={() => setView("grid")} aria-pressed={view === "grid"}>Grade</button>
          <button className="btn outline sm"><Ic.folder /> Nova pasta</button>
          <button className="btn"><Ic.upload /> Enviar arquivo</button>
        </div>
      </div>

      <nav className="flex" style={{ gap: 6, marginBottom: 16, flexWrap: "wrap" }} aria-label="Caminho da pasta">
        {crumbs.map((c, i) => (
          <React.Fragment key={c.id}>
            {i > 0 ? <Ic.chevronR style={{ width: 12, height: 12, color: "var(--text-subtle)" }} /> : null}
            <button className="btn ghost sm" onClick={() => nav("uploads", c.id === "root" ? null : c.id)}>{c.nome}</button>
          </React.Fragment>
        ))}
      </nav>

      {childFolders.length ? (
        <div className="grid4" style={{ marginBottom: 16 }}>
          {childFolders.map((fd) => (
            <div key={fd.id} className="card hov pad" onClick={() => nav("uploads", fd.id)} style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <span style={{ display: "grid", placeItems: "center", width: 36, height: 36, borderRadius: 10, background: "var(--accent-soft)", color: "var(--accent)" }}>
                <Ic.folder style={{ width: 16, height: 16 }} />
              </span>
              <span style={{ fontWeight: 600, fontSize: 13.5 }}>{fd.nome}</span>
            </div>
          ))}
        </div>
      ) : null}

      {view === "grid" ? (
        <div className="grid4">
          {files.map((u) => (
            <div key={u.id} className="card hov" style={{ overflow: "hidden" }}>
              <div style={{ aspectRatio: "16/10", background: "var(--surface-2)", display: "grid", placeItems: "center", color: "var(--text-muted)" }}>
                {u.kind === "video" ? <Ic.film style={{ width: 28, height: 28 }} /> : <Ic.pen style={{ width: 28, height: 28 }} />}
              </div>
              <div style={{ padding: "12px 14px" }}>
                <div style={{ fontWeight: 600, fontSize: 13, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{u.nome}</div>
                <div className="mlabel" style={{ marginTop: 4 }}>{u.dur ? u.dur + " · " : ""}{u.tam}</div>
              </div>
            </div>
          ))}
        </div>
      ) : (
        <div className="card rowlist">
          {files.map((u) => (
            <div key={u.id} className="row" style={{ padding: "14px 16px" }}>
              <span style={{ display: "grid", placeItems: "center", width: 36, height: 36, borderRadius: 10, background: "var(--surface-2)", color: "var(--text-muted)", border: "1px solid var(--border)" }}>

              </span>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontWeight: 600, fontSize: 13.5 }}>{u.nome}</div>
                <div className="mlabel" style={{ marginTop: 3 }}>{u.dur ? u.dur + " · " : ""}{u.tam} · enviado em {u.data}</div>
              </div>
              {u.usado
                ? <span className="badge">usado em: {u.usado}</span>
                : <span className="badge free">disponível</span>}
              {u.kind === "video" ? (
                <button className="btn soft sm" onClick={() => nav("editor")}>Abrir no Editor</button>
              ) : null}
            </div>
          ))}
        </div>
      )}

      {!files.length && !childFolders.length ? (
        <div className="empty">
          <div className="t">Pasta vazia</div>
          <div className="d">Envie vídeos ou crie subpastas para organizar sua matéria-prima.</div>

// Blister OS — composição + tweaks
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": ["#8b7cff", "#6e5bf6"],
  "density": "padrao",
  "radius": 16,
  "serif": true
}/*EDITMODE-END*/;

const DENSITY_MAP = { compacto: 0.82, padrao: 1, confortavel: 1.18 };

function PageSwitch() {
  const { route } = useOS();
  switch (route.page) {
    case "editor": return <EditorPage key={route.param || "editor"} />;
    case "cortes": return <CortesPage />;
    case "agent": return <AgentPage key={route.param} />;
    case "marketplace": return <MarketplacePage />;
    case "item": return <ItemDetailPage key={route.param} />;
    case "library": return <LibraryPage />;
    case "projects": return <ProjectsPage />;
    case "uploads": return <UploadsPage />;
    case "settings": return <SettingsPage />;
    default: return <HomePage />;
  }
}

function Shell() {
  return (
    <div className="os">
      <Sidebar />
      <div className="os-main">
        <Topbar />
        <div className="page"><PageSwitch /></div>
      </div>
    </div>
  );
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  React.useEffect(() => {
    const root = document.documentElement;
    const [acc, accStrong] = Array.isArray(t.accent) ? t.accent : [t.accent, t.accent];
    root.style.setProperty("--accent", acc);
    root.style.setProperty("--accent-strong", accStrong);
    root.style.setProperty("--accent-soft", acc + "1f");
    root.style.setProperty("--accent-soft-border", acc + "47");
    root.style.setProperty("--density", DENSITY_MAP[t.density] || 1);
    root.style.setProperty("--r-lg", t.radius + "px");
    root.style.setProperty("--r-md", Math.max(6, t.radius - 4) + "px");
    root.classList.toggle("no-serif", !t.serif);
  }, [t]);

  return (
    <OSProvider tweaks={t}>
      <Shell />
      <TweaksPanel>
        <TweakSection label="Cor" />
        <TweakColor label="Acento" value={t.accent}
          options={[["#8b7cff", "#6e5bf6"], ["#7da2ff", "#4d7bf3"], ["#5fcfc0", "#2aa893"], ["#f08bb6", "#e0588f"]]}
          onChange={(v) => setTweak("accent", v)} />
        <TweakSection label="Layout" />
        <TweakRadio label="Densidade" value={t.density}
          options={["compacto", "padrao", "confortavel"]}
          onChange={(v) => setTweak("density", v)} />
        <TweakSlider label="Raio dos cards" value={t.radius} min={8} max={22} unit="px"
          onChange={(v) => setTweak("radius", v)} />
        <TweakSection label="Tipografia" />
        <TweakToggle label="Serifa editorial nos títulos" value={t.serif}
          onChange={(v) => setTweak("serif", v)} />
      </TweaksPanel>
    </OSProvider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
